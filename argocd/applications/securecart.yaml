apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: securecart, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/securecart-gitops.git
    targetRevision: main
    path: charts/securecart
    helm: { valueFiles: [values-lab.yaml] }
  destination: { server: https://kubernetes.default.svc, namespace: securecart }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
