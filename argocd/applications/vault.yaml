apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: vault, namespace: argocd }
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: "0.34.0"
      helm: { valueFiles: ["$values/platform/vault/values.yaml"] }
    - repoURL: https://github.com/REPLACE_ME/securecart-gitops.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: vault }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
