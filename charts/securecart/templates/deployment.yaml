apiVersion: apps/v1
kind: Deployment
metadata: { name: securecart, namespace: securecart }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: securecart } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: securecart }
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-application-secrets.properties: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-application-secrets.properties: |
          {{`{{- with secret "kv/data/securecart" -}}`}}
          spring.datasource.password={{`{{ .Data.data.db_password }}`}}
          securecart.security.user.password={{`{{ .Data.data.user_password }}`}}
          securecart.security.admin.password={{`{{ .Data.data.admin_password }}`}}
          {{`{{- end -}}`}}
        {{- end }}
    spec:
      serviceAccountName: securecart
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: securecart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: securecart-config } }]
          env:
            {{- if not .Values.vault.enabled }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.bootstrapSecretName }}, key: db-password } }
            - name: APP_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.bootstrapSecretName }}, key: user-password } }
            - name: APP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.bootstrapSecretName }}, key: admin-password } }
            {{- end }}
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
