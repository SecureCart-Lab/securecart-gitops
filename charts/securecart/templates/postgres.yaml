apiVersion: v1
kind: Service
metadata: { name: securecart-postgres, namespace: securecart }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: securecart-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: securecart-postgres, namespace: securecart }
spec:
  serviceName: securecart-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: securecart-postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: securecart-postgres } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: securecart-db-bootstrap, key: postgres-password } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
