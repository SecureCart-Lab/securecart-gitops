apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: securecart-slack
  namespace: monitoring
  labels:
    securecart: enabled
spec:
  route:
    receiver: slack
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          channel: "#securecart-alerts"
          sendResolved: true
